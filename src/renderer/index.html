<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Volatility Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <section class="tabs-toolbar">
      <div id="tabs" class="tabs"></div>
      <button id="addTabBtn" class="btn">+ Add Tab</button>
      <div class="widget-add-inline">
        <select id="widgetTypeSelect"></select>
        <button id="addWidgetBtn" class="btn">+ Add Widget</button>
      </div>
    </section>

    <section class="panel config-panel">
      <div class="config-header">
        <h2>Data</h2>
        <div class="config-header-actions">
          <span class="poll-indicator" title="Polling status">
            <span id="pollStateDot" class="poll-dot is-stopped" aria-hidden="true"></span>
          </span>
          <button id="refreshBtn" class="btn btn-compact btn-icon-only" aria-label="Refresh once" title="Refresh once">↻</button>
          <button id="clearSnapshotBtn" class="btn btn-compact btn-icon-only" aria-label="Clear snapshot history" title="Clear snapshot history">⌫</button>
          <button id="startBtn" class="btn btn-compact btn-icon-only" aria-label="Start polling" title="Start polling">▶</button>
          <button id="stopBtn" class="btn btn-compact btn-icon-only" aria-label="Stop polling" title="Stop polling" disabled>■</button>
          <button id="toggleConfigBtn" class="btn btn-compact btn-icon-only" aria-label="Show config" title="Show config" aria-expanded="false">▾</button>
        </div>
      </div>
      <div id="configBody" class="config-body is-collapsed">
        <div id="globalStatus" class="status">ready</div>
        <div class="config-grid">
          <label>Provider
            <select id="providerKey">
              <option value="tradingview">TradingView</option>
            </select>
          </label>
          <label>API Base
            <input id="apiBase" />
          </label>
          <label>Ticker
            <input id="ticker" />
          </label>
          <label>Root
            <input id="root" />
          </label>
          <label>Expiry (YYYYMMDD)
            <input id="expiry" />
          </label>
          <label>Yahoo Symbol
            <input id="yahooSymbol" />
          </label>
          <label>Poll sec
            <input id="pollSec" type="number" min="1" />
          </label>
          <label>Tail steps
            <input id="tailSteps" type="number" min="1" />
          </label>
          <label>Keep points
            <input id="keepPoints" type="number" min="20" />
          </label>
        </div>
      </div>
    </section>

    <section class="panel" id="widgetsRoot"></section>
  </div>

  <div id="tabContextMenu" class="context-menu" hidden>
    <button id="tabRenameAction" class="context-menu-item">Rename tab</button>
    <button id="tabDeleteAction" class="context-menu-item">Delete tab</button>
  </div>
  <div id="renameTabModal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <h3>Rename tab</h3>
      <input id="renameTabInput" type="text" />
      <div class="modal-actions">
        <button id="renameTabCancelBtn" class="btn">Cancel</button>
        <button id="renameTabSaveBtn" class="btn">Save</button>
      </div>
    </div>
  </div>

  <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
